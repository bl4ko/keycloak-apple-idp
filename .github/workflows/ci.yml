name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apple-identity-provider
          path: build/libs/*.jar

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: bl4ko/shared-actions/.github/workflows/build_image.yml@93c21535505440a8547a7fc09649d654dccd1585 # main
    with:
      tags: ghcr.io/bl4ko/keycloak-apple-idp:latest,ghcr.io/bl4ko/keycloak-apple-idp:${{ github.sha }}
      push: ${{ github.event_name == 'push' }}
      runs-on: ubuntu-latest
      platform: linux/amd64,linux/arm64
