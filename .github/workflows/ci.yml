name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-identity-provider
          path: build/libs/*.jar

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: bl4ko/shared-actions/.github/workflows/build_image.yml@b113c8541070e4e35017d31174f6e765b1da0b5d # main
    with:
      tags: ghcr.io/bl4ko/keycloak-apple-idp:latest,ghcr.io/bl4ko/keycloak-apple-idp:${{ github.sha }}
      push: ${{ github.event_name == 'push' }}
      runs-on: ubuntu-latest
      platform: linux/amd64,linux/arm64
