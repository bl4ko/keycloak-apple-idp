name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-identity-provider
          path: build/libs/*.jar

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: bl4ko/shared-actions/.github/workflows/build_image.yml@baf01ff7a2e378a733283b1a26dd56d8108cf4e2 # main
    with:
      tags: ghcr.io/bl4ko/keycloak-apple-idp:latest,ghcr.io/bl4ko/keycloak-apple-idp:${{ github.sha }}
      push: ${{ github.event_name == 'push' }}
      runs-on: ubuntu-latest
      platform: linux/amd64,linux/arm64
