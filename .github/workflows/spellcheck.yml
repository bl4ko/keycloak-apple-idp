name: spellcheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spellcheck:
    uses: bl4ko/shared-actions/.github/workflows/spellcheck.yml@831196c62c8fca79a978a088f9ac140fc8da336d # main
