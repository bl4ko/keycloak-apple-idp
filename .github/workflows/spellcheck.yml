name: spellcheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spellcheck:
    uses: bl4ko/shared-actions/.github/workflows/spellcheck.yml@09057d6663745ef32913c88be176c73df594d7d4 # main
