name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew build --no-daemon
      - run: |
          mkdir tmp-artifacts
          cp build/libs/*.jar tmp-artifacts
          cd tmp-artifacts
          for jar in *.jar; do
            sha512sum "$jar" | awk '{ print $1 }' > "${jar}.sha512"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-identity-provider
          path: tmp-artifacts
      - run: gh release create "$GITHUB_REF_NAME" tmp-artifacts/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: curl -fsS --max-time 30 "https://jitpack.io/com/github/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/maven-metadata.xml" || true

  image:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: bl4ko/shared-actions/.github/workflows/build_image.yml@831196c62c8fca79a978a088f9ac140fc8da336d # main
    with:
      tags: ghcr.io/bl4ko/keycloak-apple-idp:${{ github.ref_name }}
      push: true
      runs-on: ubuntu-latest
      platform: linux/amd64,linux/arm64
